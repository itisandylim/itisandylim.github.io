<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andy Lim</title>
<style>
  :root {
    --ink: #1c1f26;
    --muted: #6b7280;
    --line: #e2e4e9;
    --paper: #fbfbfa;
    --accent: #2d5bd7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 38rem; margin: 0 auto; }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 0.25rem;
  }
  .role {
    color: var(--muted);
    margin: 0 0 2.5rem;
  }
  h2 {
    font: 500 0.75rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--line);
    margin: 2.5rem 0 1rem;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 1rem; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover, a:focus-visible { border-bottom-color: var(--accent); }
  .desc { color: var(--muted); display: block; font-size: 0.95rem; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
    font-size: 0.875rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>

  <h1>Your Name</h1>
  <p class="role">Software developer based in Singapore.</p>

  <p>
    The world of Web Application Development will be in my palm
  </p>

  <h2>Projects</h2>
  <ul>
    <li>
      <a href="https://github.com/yourusername/project-one">project-one</a>
      <span class="desc">Description.</span>
    </li>
    <li>
      <a href="https://github.com/yourusername/project-two">project-two</a>
      <span class="desc">Description.</span>
    </li>
  </ul>

  <h2>Elsewhere</h2>
  <ul>
    <li><a href="https://github.com/yourusername">GitHub</a></li>
    <li><a href="https://linkedin.com/in/yourusername">LinkedIn</a></li>
    <li><a href="mailto:you@example.com">Andy@example.com</a></li>
  </ul>

  <footer>Last updated August 2026</footer>

</main>
</body>
</html>
